<button class="quiz-option" onclick="checkAnswer(this, false)">A) Să o distribui imediat prietenilor</button>
                <button class="quiz-option" onclick="checkAnswer(this, true)">B) Să controlezi dacă este credibilă și reală</button>
                <button class="quiz-option" onclick="checkAnswer(this, false)">C) Să o ștergi din calculator</button>
            </div>
        </div>

        <div class="quiz-result" id="quizResult"></div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 — Cultura informațională și rolul artistului</p>
</footer>

<!-- BUTON SCROLL SUS -->
<button id="topButton" onclick="scrollToTop()">↑</button>

<!-- JAVASCRIPT INTERACTIV -->
<script>
    // 1. BARĂ DE PROGRES LA SCROLL
    window.onscroll = function() {
        let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        let scrolled = (winScroll / height) * 100;
        document.getElementById("progressBar").style.width = scrolled + "%";

        // Control buton Scroll Sus
        const topButton = document.getElementById("topButton");
        if (winScroll > 300) {
            topButton.classList.add("show");
        } else {
            topButton.classList.remove("show");
        }
    };

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 2. PANOUL INTERACTIV (LABORATOR ARTIST)
    const toolData = {
        pensula: {
            icon: "🖌️",
            title: "Pensula Digitală",
            desc: "Instrumentul principal de desen. Permite ajustarea opacității, grosimii și finisajelor pentru a crea texture unice."
        },
        paleta: {
            icon: "🎨",
            title: "Paleta de Culori",
            desc: "Constă în teorii ale culorilor (RGB, CMYK) și armonii vizuale care influențează direct starea de spirit a privitorului."
        },
        layer: {
            icon: "📚",
            title: "Straturile (Layers)",
            desc: "Permit separarea elementelor grafice (fundal, personaje, text) pentru o editare independentă și fără riscuri."
        },
        lumina: {
            icon: "💡",
            title: "Umbra și Lumina",
            desc: "Adaugă profunzime 3D și volum creației vizuale, ghidând atenția privitorului către punctul de interes."
        }
    };

    function selectTool(toolKey, btnElement) {
        // Elimina clasa active de la toate butoanele
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const data = toolData[toolKey];
        const iconEl = document.getElementById('labIcon');

        // Animație de Pop pe pictogramă
        iconEl.classList.remove('animate-pop');
        void iconEl.offsetWidth; // Trigger reflow
        iconEl.classList.add('animate-pop');

        iconEl.innerText = data.icon;
        document.getElementById('labTitle').innerText = data.title;
        document.getElementById('labDesc').innerText = data.desc;
    }

    // 3. QUIZ INTERACTIV
    function checkAnswer(button, isCorrect) {
        const options = document.querySelectorAll('.quiz-option');
        options.forEach(opt => opt.disabled = true);

        const resultDiv = document.getElementById('quizResult');

        if(isCorrect) {
            button.classList.add('correct');
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#d1fae5';
            resultDiv.style.color = '#065f46';
            resultDiv.innerHTML = "🎉 Corect! Cultura informațională presupune verificarea atentă a surselor.";
        } else {
            button.classList.add('wrong');
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#fee2e2';
            resultDiv.style.color = '#991b1b';
            resultDiv.innerHTML = "❌ Incorect! Răspunsul corect era B (Verificarea credibilității).";
        }
    }
</script>
